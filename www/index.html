${cart.rows.length?tb(['کالا','تعداد','قیمت','IMEI / سریال','جمع',''],cart.rows.map((r,i)=>[r.n,`<input type="number" min="1" value="${r.q}" style="width:64px" onchange="cart.rows[${i}].q=+this.value||1;R()">`,`<input type="number" value="${r.pr}" style="width:120px" onchange="cart.rows[${i}].pr=+this.value||0;R()">`,`<input value="${r.sn}" style="width:150px" onchange="cart.rows[${i}].sn=cl(this.value)">`,N(r.q*r.pr),`<button class="x" onclick="cart.rows.splice(${i},1);R()">حذف</button>`])):'<em>کالایی اضافه نشده است.</em>'}

function ppl(){return `<div class="cd"><h3>شخص جدید</h3><div class="fr">${inp('n','نام')}${inp('t','نوع',0,['مشتری','تأمین‌کننده','تعمیرکار'])}${inp('h','تلفن')}<button class="pr" onclick="addQ()">افزودن</button></div></div>
<div class="cd">${tb(['نام','نوع','تلفن','مانده حساب',''],S.q.map(x=>{const b=debt(x.n);return[x.n,x.t,x.h||'—',b?`<span class="pill ${b>0?'p2':'p1'}">${N(Math.abs(b))} ${b>0?'بدهکار':'بستانکار'}</span>`:'—',del('q',x.id)]}))}</div>`}
function addQ(){if(!g('n'))return;S.q.push({id:nid(),n:g('n'),t:g('t'),h:g('h')});R()}
function dbt(){const W={};docs().filter(x=>x.R>0).forEach(x=>(W[x.w]=W[x.w]||[]).push(x));DL=Object.keys(W).map(n=>({n,T:sum(W[n].map(x=>x.R)),out:W[n].some(x=>x.k=='buy')}));

let r=m;L.forEach(x=>{const p=Math.min(r,x.R);if(p>0){x.r.pays.push({a,m:p,d:tdI()});r-=p}});msg='تسویه ثبت شد.';R()}
